# /etc/nginx/conf.d/ai-approval.conf
#
# 两个对外入口（推荐用两个域名，最容易对齐本服务的来源校验）：
#   员工入口  app.example.com  →  Python 网关 127.0.0.1:8000  （对话界面 /）
#   管理入口  ops.example.com  →  C# 主服务器 127.0.0.1:8899  （/ 、/finance 、/admin）
#
# 若只有一个域名可用：先只暴露 app.example.com（员工侧），
# 运维侧临时用 SSH 隧道 `ssh -L 8899:127.0.0.1:8899 user@server` 访问，
# 因为把两套页面塞进同一个域名的子路径，会同时踩到前端绝对路径与 Origin 校验两个坑。
#
# 上线前替换两处 example.com，并把 https://ops.example.com 写进 AISERVER_TRUSTED_ORIGINS。

# ---- HTTP 全部跳 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com ops.example.com;
    return 301 https://$host$request_uri;
}

# ============================ 员工入口：Python 网关 ============================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 发票图片以 base64 走 JSON 上传，8MB 图 → 约 11MB 报文
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # 对话/OCR 会串行打模型（OCR 超时 40s、多步解析更久），给足余量
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
    }
}

# ========================= 管理入口：C# 主服务器 =============================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.example.com;

    ssl_certificate     /etc/letsencrypt/live/ops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 本服务只在 Request.IsHttps 时自己加 HSTS；TLS 在代理终止，所以这里加
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 与 Security:MaxRequestBodyBytes（262144）保持一致
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        # 多步代理循环上限 60s（Ai:AgentTimeoutSeconds），留一倍余量
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Host 必须原样透传：来源校验、审计、审批链接都以此为准
        proxy_set_header Host              $http_host;
        # Origin 不要改：靠 AISERVER_TRUSTED_ORIGINS 放行浏览器来源
        # （备选做法才是 proxy_set_header Origin "http://$http_host";）

        # 本服务只按 TCP 对端记 IP，且 WAF 会扫描该头 → 覆盖为直连地址
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        # 关键：清掉浏览器自带的 X-Client-Ip。
        # 否则一旦将来把 127.0.0.1 加进 AISERVER_TRUSTED_PROXIES，
        # 任何人都能伪造真实 IP，绕过按 IP 的限流与封禁。
        proxy_set_header X-Client-Ip       "";

        # 请求签名覆盖原始字节与时间戳，禁止代理压缩/改写请求体
        proxy_request_buffering on;
    }
}
